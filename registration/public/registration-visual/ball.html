<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>互动软式曲棍球</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}.ball-stage{position:relative;width:100%;height:100%;touch-action:none;cursor:grab;outline-offset:-25px}.ball-stage canvas{width:100%;height:100%;position:relative;z-index:1;display:block}.ball-stage img{width:100%;height:100%;object-fit:cover;clip-path:circle(39%)}.ball-stage img[hidden]{display:none}.ball-stage.dragging{cursor:grabbing}.ball-shadow{position:absolute;left:30%;bottom:9%;width:40%;height:6%;border-radius:50%;background:#260000;filter:blur(10px);opacity:var(--shadow-opacity,.2);transform:scale(var(--shadow-scale,1));pointer-events:none}.ball-stage.tap-feedback:after{content:'';position:absolute;inset:8%;border:2px solid #fff9;border-radius:50%;animation:ball-feedback .6s ease-out both;pointer-events:none}@keyframes ball-feedback{from{opacity:.8;transform:scale(.8)}to{opacity:0;transform:scale(1.3)}}@media(prefers-reduced-motion:reduce){.ball-stage.tap-feedback:after{animation:none;opacity:.5}}</style><div class="ball-stage" tabindex="0" role="button" aria-label="拖动旋转，点击或回车弹跳，方向键旋转"><img src="floorball.webp" alt="软式曲棍球"><span class="ball-shadow" aria-hidden="true"></span></div><script type="module" src="interactive-ball.js"></script></html>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公开赛 · 三种设计方向</title><style>*{box-sizing:border-box}body{margin:0;font:16px sans-serif;background:#ececec;color:#222}header{padding:20px 28px;background:white;border-top:5px solid #94070a;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:15px}h1{font-size:20px;margin:0}nav{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #bbb;background:white;padding:12px 18px;font:inherit;cursor:pointer}button.active{background:#94070a;border-color:#94070a;color:white}.tools{padding:14px 28px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.tools p{margin:0;color:#555;font-size:14px;line-height:1.8}iframe{border:0;display:block;width:100%;height:calc(100vh - 155px);margin:auto;background:white}iframe.mobile{width:390px;max-width:100%;height:calc(100vh - 155px)}a{color:#94070a}</style><header><h1>公开赛 / 设计方向</h1><nav><button class="active" onclick="pick(this,'a-club.html')">A 协会赛事</button><button onclick="pick(this,'b-court.html')">B 红色主场</button><button onclick="pick(this,'c-match.html')">C 赛场纪实</button></nav></header><div class="tools"><p>北大红 #94070A · 真实26孔用球 · 统一主站导航与页脚　<a href="research.md" target="_blank">调研记录</a></p><button onclick="document.querySelector('iframe').classList.toggle('mobile')">手机 / 桌面</button></div><iframe title="设计方案预览" src="a-club.html"></iframe><script>function pick(b,f){document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('iframe').src=f}</script></html>
